module:
  _target_: neural_local_laplacian.modules.laplacian_modules.LaplacianTransformerModule
  input_dim: 3
  d_model: 256
  nhead: 8
  num_encoder_layers: 2
  dim_feedforward: 256
  num_eigenvalues: ${globals.num_eigenvalues}
  dropout: 0.1
  normalize_loss_weights: False
  normalize_patch_features: True
  scale_areas_by_patch_size: True
  input_projection_hidden_dims: null
  output_projection_hidden_dims: null

  detach_area_head: true
  use_uniform_mass: false

  area_activation: bounded_sigmoid
  area_bound_C: 12.0

  mcv_mode: 'diagonal_gram'
  normalize_grad_by_k: true

  val_laplacian:
    assembly: diagonal_gram
    pruning: none

  fmap_val_cfg:
    k: 15
    num_eigenvectors: 100
    max_vertices_val: 5000
    eval_laplacians:
      - assembly: diagonal_gram
        pruning: none
        area_weighted: false
    geo_cache_dir: ./geo_cache
    use_geomfum_eval: true
    geomfum_descriptors: [hks, wks]
    geomfum_zoomout: false
    geomfum_zoomout_k_init: 20
    geomfum_zoomout_k_final: 50
    geomfum_zoomout_n_iters: 10

  feature_extractor: null
  loss_configs:
    # Essential scale anchor - reduced weight to prevent polynomial overfitting
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.GeneralizedLaplacianTestLoss
        loss_mode: signed_log
      weight: 0.3

    # Area supervision - keeps areas grounded
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.LogAreaSupervisionLoss
      weight: 1.0

    # Geometric constraints - prevent non-physical solutions
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.ProjectorRegularizationLoss
        w_symmetry: 1.0
        w_idempotency: 1.0
        w_trace: 0.1
      weight: 0.5

    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.StiffnessNormalAlignmentLoss
      weight: 0.5

    # Magnitude regularization - soft floor on coefficient scale
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.GradientL2RegularizationLoss
      weight: 0.001