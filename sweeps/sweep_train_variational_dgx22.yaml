# W&B sweep: variational training (train_variational.py) on Monge
# surfaces, mirrors training_config_variational/*/train_variational_dgx22.yaml.
#
# Bayes search over patch-augmentation / surface-distribution knobs
# (position_noise_std, grid_radius_range, polynomial_offset_range,
# points_scale_range, coefficient_scale_range, order_range,
# num_points_range), the model capacity / regularisation knobs
# (area_bound_C, dropout, d_model+nhead) and the optimiser knobs
# (gradient_clip_val, lr).
#
# Sweep metric: fmap geo_at_05pct on DT4D Animals, single
# diagonal_gram Laplacian (dgx22 has one fmap_val_cfg.eval_laplacians
# entry — assembly=diagonal_gram — so the metric is logged unprefixed
# as ``val_fmap/animals/fmap_hks_wks/geo_at_05pct``).
#
# Usage:
#   wandb sweep sweeps/sweep_train_variational_dgx22.yaml
#   python train_variational.py --sweep-id <entity/project/sweep_id>

program: ./train_variational.py
command:
  - python
  - ${program}
method: bayes
metric:
  goal: maximize
  name: val_fmap/animals/fmap_hks_wks/geo_at_05pct
#run_cap: 80
parameters:
  # ===================================================================
  # Globals (sweep knobs live here; every other block reads them via
  # ${globals.<name>} interpolation).
  # ===================================================================
  globals:
    parameters:
      training_seed:
        value: 42

      validation_seed:
        value: 3

      num_eigenvalues:
        value: 50

      ckpt_path:
        value: null

      # ── Optimiser ─────────────────────────────────────────────────
      lr:
        distribution: log_uniform_values
        min: 1.0e-5
        max: 5.0e-4

      gradient_clip_val:
        values:
          - 0.1
          - 0.5
          - 1.0
          - 2.0

      # ── Model capacity / regularisation ───────────────────────────
      # d_model and nhead must satisfy d_model % nhead == 0; sweep them
      # jointly via a single paired knob to avoid invalid combos.
      # Index 0 → d_model, index 1 → nhead.  dim_feedforward is tied
      # to d_model below.
      d_model_nhead_pair:
        values:
          - [384, 6]
          - [512, 8]
          - [768, 8]
          - [768, 12]
          - [1024, 8]
          - [1024, 16]

      dropout:
        values:
          - 0.0
          - 0.1
          - 0.2
          - 0.3

      area_bound_C:
        values:
          - 1.0
          - 2.0
          - 5.0
          - 10.0

      # ── Surface / patch distribution (data_module knobs) ──────────
      position_noise_std:
        values:
          - [0.0,  0.01]
          - [0.01, 0.05]
          - [0.02, 0.1]
          - [0.0,  0.0]

      grid_radius_range:
        values:
          - [0.25, 1.0]
          - [0.5,  2.0]
          - [0.5,  3.0]
          - [1.0,  3.0]

      polynomial_offset_range:
        values:
          - [0.0, 0.5]
          - [0.0, 1.0]
          - [0.0, 2.0]

      points_scale_range:
        values:
          - [1.0]
          - [0.5, 1.5]
          - [0.5, 2.0]

      coefficient_scale_range:
        values:
          - [0.25, 1.5]
          - [0.5,  3.0]
          - [0.5,  5.0]
          - [1.0,  5.0]

      order_range:
        values:
          - [2, 2]
          - [2, 3]
          - [2, 4]
          - [3, 4]

      num_points_range:
        values:
          - [6,  20]
          - [6,  30]
          - [10, 40]
          - [20, 60]

  # ===================================================================
  # Data module (dgx22 — augmentation / surface knobs read sweep
  # parameters; everything else pinned to the dgx22 baseline)
  # ===================================================================
  data_module:
    value:
      module:
        _target_: neural_local_laplacian.data_modules.common.GenericMixedDataModule
        train_dataset_specification:
          _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
          dataset:
            _target_: neural_local_laplacian.datasets.synthetic_datasets.PolynomialSurfaceDataset
            seed: ${globals.training_seed}
            epoch_size: 24000
            position_noise_std: ${globals.position_noise_std}
            grid_radius_range: ${globals.grid_radius_range}
            polynomial_offset_range: ${globals.polynomial_offset_range}
            points_scale_range: ${globals.points_scale_range}
            coefficient_scale_range: ${globals.coefficient_scale_range}
            order_range: ${globals.order_range}
            grid_samplers:
              - _target_: neural_local_laplacian.datasets.synthetic_datasets.RandomGridSampler
                num_points_range: ${globals.num_points_range}
            conv_k_nearest: null
            pose_transformers: null
            coeff_generation_method:
              _target_: neural_local_laplacian.datasets.synthetic_datasets.CoeffGenerationMethod
              _args_: ['uniform']
            diff_geom_components:
              - _target_: neural_local_laplacian.datasets.synthetic_datasets.DifferentialGeometryComponent
                _args_: ['mean_curvature']
            diff_geom_at_origin_only: True
            include_origin_in_grid: False
            flip_normal_if_negative_curvature: False
            normalize_to_unit_sphere: True
          batch_size: 20
          num_workers: 10
          shuffle: True
        val_dataset_specifications:
          # Mesh val (pinned)
          - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: neural_local_laplacian.datasets.mesh_datasets.MeshDataset
              mesh_folder_path: '/workspace/datasets/shrec15'
              max_meshes: 80
              file_size_range_mb: [0.5, 4]
              require_manifold: True
              shuffle: True
              k: 8
              num_geodesic_sources: 5
              geodesic_source_method: "farthest_point_sampling"
            batch_size: 1
            num_workers: 0
            shuffle: False
          # Fmap DT4D Animals (pinned; supplies the sweep metric)
          - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
                root: '/workspace/datasets/DeformingThings4DMatching-Animals'
                pairs: ["0.7:1.0"]
              val_poses_per_pair: 2
              seed: ${globals.training_seed}
            batch_size: 1
            num_workers: 0
            shuffle: false
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true

  # ===================================================================
  # Model (dgx22 — d_model / nhead / dropout / area_bound_C read sweep
  # knobs; everything else pinned)
  # ===================================================================
  model:
    value:
      module:
        _target_: neural_local_laplacian.modules.laplacian_modules.LaplacianTransformerModule
        input_dim: 3
        d_model: ${globals.d_model_nhead_pair.0}
        nhead: ${globals.d_model_nhead_pair.1}
        num_encoder_layers: 1
        dim_feedforward: ${globals.d_model_nhead_pair.0}
        num_eigenvalues: ${globals.num_eigenvalues}
        dropout: ${globals.dropout}
        normalize_loss_weights: False
        normalize_patch_features: True
        scale_areas_by_patch_size: True
        input_projection_hidden_dims: null
        output_projection_hidden_dims: null

        detach_area_head: true
        use_uniform_mass: false

        area_activation: bounded_sigmoid
        area_bound_C: ${globals.area_bound_C}

        mcv_mode: 'diagonal_gram'
        stiffness_mode: 'diagonal_gram'
        normalize_grad_by_sqrt_k: true
        normalize_grad_by_k: false
        normalize_stiffness_by_k: false

        val_laplacian:
          assembly: diagonal_gram
          pruning: none

        fmap_val_cfg:
          k: 15
          num_eigenvectors: 100
          max_vertices_val: 5000
          eval_laplacians:
            - assembly: diagonal_gram
              pruning: none
              area_weighted: false
          geo_cache_dir: ./geo_cache
          use_geomfum_eval: true
          geomfum_descriptors: [hks, wks]
          geomfum_zoomout: false
          geomfum_zoomout_k_init: 20
          geomfum_zoomout_k_final: 50
          geomfum_zoomout_n_iters: 10
          fmap_lmbda: 1.0
          fmap_resolvent_gamma: 1.0

        feature_extractor: null
        loss_configs:
          - _target_: neural_local_laplacian.modules.losses.LossConfig
            loss_module:
              _target_: neural_local_laplacian.modules.losses.DirectionCosineLoss
            weight: 1.0
          - _target_: neural_local_laplacian.modules.losses.LossConfig
            loss_module:
              _target_: neural_local_laplacian.modules.losses.AreaOnlyLogMagnitudeLoss
            weight: 2.0

  # ===================================================================
  # Optimizer (dgx22 — lr swept)
  # ===================================================================
  optimizer:
    value:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: ${globals.lr}

  # ===================================================================
  # Scheduler (dgx22 — pinned)
  # ===================================================================
  scheduler:
    value:
      _target_: torch.optim.lr_scheduler.CosineAnnealingLR
      _partial_: true
      T_max: 60000
      eta_min: 1.0e-6
      last_epoch: -1

  # ===================================================================
  # Trainer (dgx22 — gradient_clip_val swept; max_epochs capped for
  # sweep tractability; ModelCheckpoint monitors the sweep metric)
  # ===================================================================
  trainer:
    value:
      _target_: lightning.pytorch.Trainer
      max_epochs: 50
      devices: -1
      accelerator: 'auto'
      strategy: 'auto'
      num_sanity_val_steps: 0
      log_every_n_steps: 1
      check_val_every_n_epoch: 5
      enable_progress_bar: True
      gradient_clip_val: ${globals.gradient_clip_val}
      logger:
        _target_: lightning.pytorch.loggers.WandbLogger
        project: neural-cotangent-weights
        save_dir: 'wandb'
        log_model: 'all'
      callbacks:
        - _target_: lightning.pytorch.callbacks.ModelCheckpoint
          dirpath: "./checkpoints"
          filename: "best-{epoch:010d}-{val_fmap/animals/fmap_hks_wks/geo_at_05pct:.4f}"
          monitor: val_fmap/animals/fmap_hks_wks/geo_at_05pct
          mode: max
          save_top_k: 3
          verbose: False
          save_on_train_epoch_end: False
