program: ./train_fmaps.py
command:
  - python
  - ${program}
method: bayes
metric:
  goal: maximize
  name: val/best_acc
parameters:
  # ═══════════════════════════════════════════════════════════════════════════
  # Globals — sweepable hyperparameters + fixed scalars
  # ═══════════════════════════════════════════════════════════════════════════
  globals:
    parameters:
      training_seed:
        value: 42
      ckpt_path:
        value: null
      checkpoint_path:
        value: '/workspace/models/model.ckpt'
      num_eigenvectors:
        value: 100
      k_sparsify:
        value: null               # null = reuse k; integer < k = separate kNN for mask

      # ── Swept ─────────────────────────────────────────────────────────────
      k:
        values:
          - 5
          - 10
          - 20
      lr:
        values:
          - 1.0e-5
      gradient_clip_val:
        values:
          - 0.0
          - 10.0
      loss_type:
        values:
          - infonce
      temperature:
        values:
          - 0.05
          - 0.1
      vertex_budget:
        values:
          - num_landmarks: 128
            num_sample_vertices: 512
            max_vertices: 2000
            max_vertices_val: 4000

          - num_landmarks: 256
            num_sample_vertices: 1024
            max_vertices: 2000
            max_vertices_val: 4000
      alphas:
        values:
          - [1.0, 10.0, 100.0]
          - [0.1, 1.0, 10.0]
      w_prox:
        values:
          - 0.0
          - 10.0
          - 30.0
      vertex_noise:
        values:
          - 0.0
      cross_ratio_end:
        values:
          - 0.5
      curriculum_epochs:
        value: 0

  # ═══════════════════════════════════════════════════════════════════════════
  # Data module (DT4D Mixed) — Animals train, Animals+Humanoids val
  # ═══════════════════════════════════════════════════════════════════════════
  data_module:
    value:
      module:
        _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule

        train_dataset_specification:
          _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
          dataset:
            _target_: fmaps_finetune.datasets.functional_map_dataset.ShapePairDataset
            pair_generator:
              _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
              root: '/workspace/datasets/DeformingThings4DMatching-Animals'
              exclude_categories: [bear3EP, crocodileOPW, duck, foxXAT, hippoDG, rabbit7L6, tigerD8H, zebraBM]
            num_samples: 120
            cross_ratio: 0.0
          batch_size: 6
          num_workers: 0
          shuffle: true
          collate_fn:
            _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
            _partial_: true

        val_dataset_specifications:
          # [0] Animals — same-category, held-out (primary for checkpointing)
          - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
                root: '/workspace/datasets/DeformingThings4DMatching-Animals'
                categories: [bear3EP, crocodileOPW, duck, foxXAT, hippoDG, rabbit7L6, tigerD8H, zebraBM]
              val_poses_per_pair: 5
              seed: ${globals.training_seed}
            batch_size: 1
            num_workers: 0
            shuffle: false
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true

          # [1] Humanoids — cross-category pairs
          - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DHumanoidPairGenerator
                root: '/workspace/datasets/DeformingThings4DMatching'
                categories: null
                exclude_categories: null
                enable_cross_category: true
              val_poses_per_pair: 2
              seed: ${globals.training_seed}
            batch_size: 1
            num_workers: 0
            shuffle: false
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Model — references swept globals via interpolation
  # ═══════════════════════════════════════════════════════════════════════════
  model:
    value:
      module:
        _target_: fmaps_finetune.modules.functional_map_module.FunctionalMapModule
        checkpoint_path: ${globals.checkpoint_path}
        k: ${globals.k}
        num_eigenvectors: ${globals.num_eigenvectors}
        seed: ${globals.training_seed}

        # ── Contrastive loss ────────────────────────────────────────────────
        loss_fn:
          _target_: fmaps_finetune.modules.functional_map_module.SoftCorrespondenceLoss
          num_landmarks: ${globals.vertex_budget.num_landmarks}
          alphas: ${globals.alphas}
          temperature: ${globals.temperature}
          num_sample_vertices: ${globals.vertex_budget.num_sample_vertices}
          loss_type: ${globals.loss_type}
          dclw_sigma: 0.5

        # ── Model initialisation ────────────────────────────────────────────
        random_init: false
        keep_areas_head: false
        freeze_input_projection: false
        freeze_areas_head: false

        # ── Laplacian assembly ──────────────────────────────────────────────
        sparsify_laplacian: false
        k_sparsify: ${globals.k_sparsify}

        # ── Training augmentation ───────────────────────────────────────────
        max_vertices: ${globals.vertex_budget.max_vertices}
        max_vertices_val: ${globals.vertex_budget.max_vertices_val}
        vertex_noise: ${globals.vertex_noise}

        # ── Proximity regularisation ────────────────────────────────────────
        w_prox: ${globals.w_prox}

        # ── Cross-pair curriculum ───────────────────────────────────────────
        cross_ratio_start: 0.0
        cross_ratio_end: ${globals.cross_ratio_end}
        curriculum_epochs: ${globals.curriculum_epochs}

        # ── LoRA ────────────────────────────────────────────────────────────
        use_lora: false
        lora_rank: 8
        lora_alpha: 16
        lora_dropout: 0.0
        lora_target_modules: "all-linear"
        lora_dora: false
        lora_rslora: false

        # ── GeomFuM evaluation ──────────────────────────────────────────────
        use_geomfum_eval: true
        geomfum_descriptors: [hks, wks]
        geomfum_zoomout: true
        geomfum_zoomout_k_init: 20
        geomfum_zoomout_k_final: 50
        geomfum_zoomout_n_iters: 10
        geomfum_fmap_lmbda: 1.0e+3
        geomfum_fmap_resolvent_gamma: 1.0

  # ═══════════════════════════════════════════════════════════════════════════
  # Optimizer — lr swept via globals
  # ═══════════════════════════════════════════════════════════════════════════
  optimizer:
    value:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: ${globals.lr}

  # ═══════════════════════════════════════════════════════════════════════════
  # Trainer — gradient_clip_val swept via globals
  # ═══════════════════════════════════════════════════════════════════════════
  trainer:
    value:
      _target_: lightning.pytorch.Trainer
      accelerator: auto
      devices: auto
      strategy: auto
      max_epochs: 2000
      accumulate_grad_batches: 1
      gradient_clip_val: ${globals.gradient_clip_val}
      gradient_clip_algorithm: norm
      precision: 32
      num_sanity_val_steps: 0
      check_val_every_n_epoch: 50
      log_every_n_steps: 1
      enable_progress_bar: true
      default_root_dir: fmap_finetune_runs
      logger:
        _target_: lightning.pytorch.loggers.WandbLogger
        project: neural-local-laplacian-fmaps
        save_dir: fmap_finetune_runs
        log_model: 'all'
      callbacks:
        - _target_: lightning.pytorch.callbacks.ModelCheckpoint
          monitor: val/best_acc
          mode: max
          save_top_k: 1
          save_last: false
          filename: "best-epoch={epoch:04d}-acc={val/best_acc:.4f}"
          auto_insert_metric_name: false
        - _target_: lightning.pytorch.callbacks.LearningRateMonitor
          logging_interval: epoch