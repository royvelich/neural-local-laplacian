# W&B sweep: evaluate pretrained model on 5 dataset flavors × 2 k values.
# Grid: k (2) × data_module (5) = 10 runs, each loading one dataset.
#
# Usage:
#   wandb sweep fmaps_config/sweeps/eval_5datasets.yaml
#   wandb agent <entity/project/sweep_id>

program: ./train_fmaps.py
command:
  - python
  - ${program}
method: grid
parameters:
  # ═══════════════════════════════════════════════════════════════════════════
  # Globals
  # ═══════════════════════════════════════════════════════════════════════════
  globals:
    parameters:
      training_seed:
        value: 42
      ckpt_path:
        value: null
      checkpoint_path:
        value: '/workspace/models/model.ckpt'
      num_eigenvectors:
        value: 100

      # ── Swept ─────────────────────────────────────────────────────────────
      k:
        values:
          - 6
          - 8
          - 10

  # ═══════════════════════════════════════════════════════════════════════════
  # Data module — swept: one dataset per run
  # ═══════════════════════════════════════════════════════════════════════════
  data_module:
    values:
      # ─── [0] Animals intra ──────────────────────────────────────────────
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification: null
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
                  root: '/workspace/datasets/DeformingThings4DMatching-Animals'
                val_poses_per_pair: 30
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # ─── [1] Humanoids intra ────────────────────────────────────────────
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification: null
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DHumanoidPairGenerator
                  root: '/workspace/datasets/DeformingThings4DMatching'
                  pair_mode: intra
                val_poses_per_pair: 30
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # ─── [2] Humanoids inter ────────────────────────────────────────────
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification: null
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DHumanoidPairGenerator
                  root: '/workspace/datasets/DeformingThings4DMatching'
                  pair_mode: inter
                val_poses_per_pair: 30
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # ─── [3] FAUST intra ───────────────────────────────────────────────
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification: null
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.FAUSTPairGenerator
                  root: '/workspace/datasets/faust'
                  pair_mode: intra
                val_poses_per_pair: 30
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # ─── [4] FAUST inter ───────────────────────────────────────────────
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification: null
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.FAUSTPairGenerator
                  root: '/workspace/datasets/faust'
                  pair_mode: inter
                val_poses_per_pair: 30
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Model — eval only, both assembly variants
  # ═══════════════════════════════════════════════════════════════════════════
  model:
    value:
      module:
        _target_: fmaps_finetune.modules.functional_map_module.FunctionalMapModule
        checkpoint_path: ${globals.checkpoint_path}
        k: ${globals.k}
        num_eigenvectors: ${globals.num_eigenvectors}
        seed: ${globals.training_seed}

        eval_only: true
        skip_baselines: false
        geo_cache_workers: 12

        train_laplacian:
          assembly: diagonal_gram
          pruning: none
        eval_laplacians:
          - assembly: diagonal_gram
            pruning: none

        losses: null

        random_init: false
        keep_areas_head: false
        freeze_input_projection: false
        freeze_areas_head: false

        max_vertices: 5000
        max_vertices_val: 0
        vertex_noise: 0.0
        w_prox: 0.0

        use_lora: false
        lora_rank: 8
        lora_alpha: 16
        lora_dropout: 0.0
        lora_target_modules: "all-linear"
        lora_dora: false
        lora_rslora: false

        use_geomfum_eval: true
        geomfum_descriptors: [hks, wks]
        geomfum_zoomout: true
        geomfum_zoomout_k_init: 20
        geomfum_zoomout_k_final: 50
        geomfum_zoomout_n_iters: 10
        geomfum_fmap_lmbda: 1.0e+3
        geomfum_fmap_resolvent_gamma: 1.0

  # ═══════════════════════════════════════════════════════════════════════════
  # Optimizer (unused in eval_only)
  # ═══════════════════════════════════════════════════════════════════════════
  optimizer:
    value: null

  # ═══════════════════════════════════════════════════════════════════════════
  # Trainer
  # ═══════════════════════════════════════════════════════════════════════════
  trainer:
    value:
      _target_: lightning.pytorch.Trainer
      accelerator: auto
      devices: auto
      strategy: auto
      max_epochs: 1
      accumulate_grad_batches: 1
      gradient_clip_val: 0.0
      gradient_clip_algorithm: norm
      precision: 32
      num_sanity_val_steps: 0
      check_val_every_n_epoch: 1
      log_every_n_steps: 1
      enable_progress_bar: true
      default_root_dir: fmap_finetune_runs
      logger:
        _target_: lightning.pytorch.loggers.WandbLogger
        project: neural-local-laplacian-fmaps
        save_dir: fmap_finetune_runs
        log_model: false
      callbacks: []