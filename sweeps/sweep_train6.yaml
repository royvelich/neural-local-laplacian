# W&B sweep: fine-tune on 5 dataset flavors with 70/30 train/val split.
# Grid: checkpoint_path (1) x data_module (5) = 5 runs.
#
# Usage:
#   wandb sweep fmaps_config/sweeps/train_5datasets.yaml
#   wandb agent <entity/project/sweep_id>

program: ./train_fmaps.py
command:
  - python
  - ${program}
method: grid
metric:
  goal: maximize
  name: val/best_acc
parameters:
  # ===================================================================
  # Globals
  # ===================================================================
  globals:
    parameters:
      training_seed:
        value: 42
      ckpt_path:
        value: null
      checkpoint_path:
        values:
          - '/workspace/models/model900.ckpt'
      num_eigenvectors:
        value: 100
      k:
        values:
          - 15
          - 20
      lr:
        value: 1.0e-5
      gradient_clip_val:
        value: 0.0

      # --- Dataset globals (referenced by all data_module entries) ---
      num_samples:
        value: 160
      train_batch_size:
        value: 2
      train_pairs:
        value: [0.7]
      val_pairs:
        value: ["0.7:1.0"]
      val_poses_per_pair:
        value: 15

      loss_preset:
        value:
          - _target_: fmaps_finetune.modules.functional_map_module.GeodesicDiffusionLoss
            weight: 1.0
            landmark_ratio: 0.2
#            num_landmarks: 256
#            num_sample_vertices: 2048
            alphas: [0.01, 0.1, 1.0, 10.0]
            normalize: false

  # ===================================================================
  # Data module -- swept: one dataset per run (70/30 train/val split)
  # ===================================================================
  data_module:
    values:
      # --- [0] Animals intra -------------------------------------------
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification:
            _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ShapePairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
                root: '/workspace/datasets/DeformingThings4DMatching-Animals'
                pairs: ${globals.train_pairs}
              num_samples: ${globals.num_samples}
              seed: ${globals.training_seed}
            batch_size: ${globals.train_batch_size}
            num_workers: 0
            shuffle: true
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
                  root: '/workspace/datasets/DeformingThings4DMatching-Animals'
                  pairs: ${globals.val_pairs}
                val_poses_per_pair: ${globals.val_poses_per_pair}
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # --- [1] Humanoids intra -----------------------------------------
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification:
            _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ShapePairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DHumanoidPairGenerator
                root: '/workspace/datasets/DeformingThings4DMatching'
                pair_mode: intra
                pairs: ${globals.train_pairs}
              num_samples: ${globals.num_samples}
              seed: ${globals.training_seed}
            batch_size: ${globals.train_batch_size}
            num_workers: 0
            shuffle: true
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DHumanoidPairGenerator
                  root: '/workspace/datasets/DeformingThings4DMatching'
                  pair_mode: intra
                  pairs: ${globals.val_pairs}
                val_poses_per_pair: ${globals.val_poses_per_pair}
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # --- [2] Humanoids inter -----------------------------------------
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification:
            _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ShapePairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DHumanoidPairGenerator
                root: '/workspace/datasets/DeformingThings4DMatching'
                pair_mode: inter
                pairs: ${globals.train_pairs}
              num_samples: ${globals.num_samples}
              seed: ${globals.training_seed}
            batch_size: ${globals.train_batch_size}
            num_workers: 0
            shuffle: true
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DHumanoidPairGenerator
                  root: '/workspace/datasets/DeformingThings4DMatching'
                  pair_mode: inter
                  pairs: ${globals.val_pairs}
                val_poses_per_pair: ${globals.val_poses_per_pair}
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # --- [3] FAUST intra ---------------------------------------------
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification:
            _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ShapePairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.FAUSTPairGenerator
                root: '/workspace/datasets/faust'
                pair_mode: intra
                pairs: ${globals.train_pairs}
              num_samples: ${globals.num_samples}
              seed: ${globals.training_seed}
            batch_size: ${globals.train_batch_size}
            num_workers: 0
            shuffle: true
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.FAUSTPairGenerator
                  root: '/workspace/datasets/faust'
                  pair_mode: intra
                  pairs: ${globals.val_pairs}
                val_poses_per_pair: ${globals.val_poses_per_pair}
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

      # --- [4] FAUST inter ---------------------------------------------
      - module:
          _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule
          train_dataset_specification:
            _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
            dataset:
              _target_: fmaps_finetune.datasets.functional_map_dataset.ShapePairDataset
              pair_generator:
                _target_: fmaps_finetune.datasets.functional_map_dataset.FAUSTPairGenerator
                root: '/workspace/datasets/faust'
                pair_mode: inter
                pairs: ${globals.train_pairs}
              num_samples: ${globals.num_samples}
              seed: ${globals.training_seed}
            batch_size: ${globals.train_batch_size}
            num_workers: 0
            shuffle: true
            collate_fn:
              _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
              _partial_: true
          val_dataset_specifications:
            - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
              dataset:
                _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
                pair_generator:
                  _target_: fmaps_finetune.datasets.functional_map_dataset.FAUSTPairGenerator
                  root: '/workspace/datasets/faust'
                  pair_mode: inter
                  pairs: ${globals.val_pairs}
                val_poses_per_pair: ${globals.val_poses_per_pair}
                seed: ${globals.training_seed}
              batch_size: 1
              num_workers: 0
              shuffle: false
              collate_fn:
                _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
                _partial_: true

  # ===================================================================
  # Model
  # ===================================================================
  model:
    value:
      module:
        _target_: fmaps_finetune.modules.functional_map_module.FunctionalMapModule
        checkpoint_path: ${globals.checkpoint_path}
        k: ${globals.k}
        num_eigenvectors: ${globals.num_eigenvectors}
        seed: ${globals.training_seed}

        mode: train
        baselines: []
        geo_cache_dir: ./geo_cache
        eval_results_dir: ./eval_results/train

        # Laplacian assembly (config-driven)
        train_laplacian:
          assembly: diagonal_gram
          pruning: none
          area_weighted: false
        eval_laplacians:
          - assembly: diagonal_gram
            pruning: none
            area_weighted: false

        losses: ${globals.loss_preset}

        random_init: false
        keep_areas_head: false
        freeze_input_projection: false
        freeze_areas_head: false

        max_vertices: 4000
        vertex_noise: 0.0
        w_prox: 0.0

        use_lora: false
        lora_rank: 8
        lora_alpha: 16
        lora_dropout: 0.0
        lora_target_modules: "all-linear"
        lora_dora: false
        lora_rslora: false

        profile_steps: 0

        # GeomFuM functional map evaluation
        use_geomfum_eval: true
        geomfum_descriptors: [hks, wks]
        geomfum_zoomout: false
        geomfum_zoomout_k_init: 20
        geomfum_zoomout_k_final: 50
        geomfum_zoomout_n_iters: 10
        geomfum_fmap_lmbda: 1.0           # relaxed from 1e3 for neural Laplacians
        geomfum_fmap_resolvent_gamma: 1.0

  # ===================================================================
  # Optimizer
  # ===================================================================
  optimizer:
    value:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: ${globals.lr}

  # ===================================================================
  # Trainer
  # ===================================================================
  trainer:
    value:
      _target_: lightning.pytorch.Trainer
      accelerator: auto
      devices: auto
      strategy: auto
      max_epochs: 50
      accumulate_grad_batches: 1
      gradient_clip_val: ${globals.gradient_clip_val}
      gradient_clip_algorithm: norm
      precision: 32
      num_sanity_val_steps: 0
      check_val_every_n_epoch: 25
      log_every_n_steps: 1
      enable_progress_bar: true
      default_root_dir: fmap_finetune_runs
      logger:
        _target_: lightning.pytorch.loggers.WandbLogger
        project: neural-local-laplacian-fmaps
        save_dir: fmap_finetune_runs
        log_model: all
      callbacks:
        - _target_: lightning.pytorch.callbacks.ModelCheckpoint
          monitor: val/best_acc
          mode: max
          save_top_k: 1
          save_last: false
          filename: "best-epoch={epoch:04d}-acc={val/best_acc:.4f}"
          auto_insert_metric_name: false
        - _target_: lightning.pytorch.callbacks.LearningRateMonitor
          logging_interval: epoch