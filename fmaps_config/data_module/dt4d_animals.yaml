# fmaps_config/data_module/dt4d_animals.yaml
# DeformingThings4DMatching Animals — inter-category pairs only (no cross-category).
#
# 53 animal categories, split into 45 train / 8 val.
# Val categories chosen for body-type diversity:
#   bear, crocodile, duck, fox, hippo, rabbit, tiger, zebra.
#
# Required CLI overrides:
#   data_module.module.train_dataset_specification.dataset.pair_generator.root=<path>
#   data_module.module.val_dataset_specifications.0.dataset.pair_generator.root=<path>

module:
  _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule

  train_dataset_specification:
    _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
    dataset:
      _target_:  fmaps_finetune.datasets.functional_map_dataset.ShapePairDataset
      pair_generator:
        _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
        root: "F:/3DV22_DeformingThings4DMatching_dataset-main/DeformingThings4DMatching-Animals"
        exclude_categories: [bear3EP, crocodileOPW, duck, foxXAT, hippoDG, rabbit7L6, tigerD8H, zebraBM]
      num_samples: 120
      cross_ratio: 0.0               # ignored for animals (no cross-category)
    batch_size: 6
    num_workers: 0
    shuffle: true
    collate_fn:
      _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
      _partial_: true

  val_dataset_specifications:
    - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
      dataset:
        _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
        pair_generator:
          _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
          root: "F:/3DV22_DeformingThings4DMatching_dataset-main/DeformingThings4DMatching-Animals"
          categories: [bear3EP, crocodileOPW, duck, foxXAT, hippoDG, rabbit7L6, tigerD8H, zebraBM]
        val_poses_per_pair: 2
        seed: ${globals.training_seed}
      batch_size: 1
      num_workers: 0
      shuffle: false
      collate_fn:
        _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
        _partial_: true