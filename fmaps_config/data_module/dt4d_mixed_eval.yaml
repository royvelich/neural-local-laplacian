# fmaps_config/data_module/dt4d_animals.yaml
# Training: DT4D Animals (45 categories, same-category pairs)
# Validation:
#   [0] Animals — 8 held-out categories, same-category (primary for checkpointing)
#   [1] Humanoids — cross-category pairs
#
# Required CLI overrides for paths:
#   data_module.module.train_dataset_specification.dataset.pair_generator.root=<animals_path>
#   data_module.module.val_dataset_specifications.0.dataset.pair_generator.root=<animals_path>
#   data_module.module.val_dataset_specifications.1.dataset.pair_generator.root=<humanoids_path>

module:
  _target_: neural_local_laplacian.data_modules.common.GenericPlainDataModule

  train_dataset_specification: null

  val_dataset_specifications:
    # [0] Animals — same-category, held-out (primary for checkpointing)
    - _target_: neural_local_laplacian.data_modules.common.DatasetSpecification
      dataset:
        _target_: fmaps_finetune.datasets.functional_map_dataset.ValPairDataset
        pair_generator:
          _target_: fmaps_finetune.datasets.functional_map_dataset.DT4DAnimalsPairGenerator
          root: "F:/3DV22_DeformingThings4DMatching_dataset-main/DeformingThings4DMatching-Animals"
          categories: null
        val_poses_per_pair: 5
        seed: ${globals.training_seed}
      batch_size: 1
      num_workers: 0
      shuffle: false
      collate_fn:
        _target_: fmaps_finetune.datasets.functional_map_dataset.pair_collate_fn
        _partial_: true

