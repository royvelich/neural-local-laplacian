# fmaps_config/globals/default.yaml

training_seed: 42

# Path to resume a Lightning checkpoint from a previous run.
# null = start fresh.  This is NOT the pretrained base model checkpoint.
ckpt_path: null

# Path to the pretrained LaplacianTransformerModule checkpoint used to
# load the architecture and initial weights.  Required — no default.
checkpoint_path: 'C:\Users\Roy\Downloads\model.ckpt'

# kNN neighbourhood size for the differentiable Laplacian.
k: 30

# Number of LBO eigenvectors used during evaluation.
num_eigenvectors: 100