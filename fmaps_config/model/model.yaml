# fmaps_config/model/default.yaml
# FunctionalMapModule hyperparameters.
# optimizer_cfg and scheduler_cfg are injected by train_fmaps.py at instantiation
# time (same pattern as train.py / LaplacianModuleBase).

module:
  _target_:  fmaps_finetune.modules.functional_map_module.FunctionalMapModule
  checkpoint_path: ${globals.checkpoint_path}
  k: ${globals.k}
  num_eigenvectors: ${globals.num_eigenvectors}
  seed: ${globals.training_seed}

  # ── Losses ──────────────────────────────────────────────────────────────
  # List of loss modules, each with its own weight. The training step
  # computes: total_loss = Σ loss_i.weight * loss_i(S_A, S_B, M_A, M_B, ...)
  losses:
    - _target_: fmaps_finetune.modules.functional_map_module.SoftCorrespondenceLoss
      weight: 1.0
      num_landmarks: 256
      alphas: [0.1, 1.0, 10.0]    # diffusion scales α for fingerprint descriptors
      temperature: 0.1
      num_sample_vertices: 1024      # vertices subsampled for contrastive ranking per step
      loss_type: infonce             # infonce | dcl | dclw
      dclw_sigma: 0.1                # only used when loss_type=dclw

    # Uncomment to add isospectrality loss (unsupervised, no GT needed):
#     - _target_: fmaps_finetune.modules.functional_map_module.IsospectralityLoss
#       weight: 1.0
#       num_eigenvalues: 60

  # ── Model initialisation ────────────────────────────────────────────────
  random_init: false               # reset all weights after loading architecture
  keep_areas_head: false           # with random_init=true: preserve pretrained area head
  freeze_input_projection: false
  freeze_areas_head: false

  # ── Laplacian assembly ──────────────────────────────────────────────────
  sparsify_laplacian: true        # zero out off-kNN entries in the dense G^TMG
  k_sparsify: ${globals.k_sparsify}  # null = reuse k; integer < k = separate kNN for mask

  # ── Training augmentation ───────────────────────────────────────────────
  max_vertices: 2000               # 0 = no subsampling; lower → faster O(N³) solve
  max_vertices_val: 0              # 0 = use max_vertices; set higher for better val quality
  vertex_noise: 0.0               # Gaussian noise scale relative to mean vertex radius

  # ── Proximity regularisation ────────────────────────────────────────────
  w_prox: 0.0                     # 0.0 to disable; ignored with random_init or use_lora

  # ── Cross-pair curriculum ───────────────────────────────────────────────
  # Linearly ramps the fraction of cross-category pairs from start → end
  # over the first curriculum_epochs epochs, then stays at cross_ratio_end.
  cross_ratio_start: 0.0
  cross_ratio_end: 0.8
  curriculum_epochs: 0

  # ── LoRA (Low-Rank Adaptation) ──────────────────────────────────────────
  use_lora: false
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_target_modules: "all-linear"   # comma-separated names or "all-linear"
  lora_dora: false                    # Weight-Decomposed LoRA (DoRA)
  lora_rslora: false                  # Rank-Stabilized LoRA (rsLoRA)

  # ── GeomFuM evaluation (optional, heavier than spectral_nn) ─────────────
  use_geomfum_eval: true             # run FunctionalMapEvaluator during validation
  geomfum_descriptors: [hks, wks]     # descriptor types for fmap evaluation
  geomfum_zoomout: true               # ZoomOut spectral upsampling refinement
  geomfum_zoomout_k_init: 20
  geomfum_zoomout_k_final: 50
  geomfum_zoomout_n_iters: 10
  geomfum_fmap_lmbda: 1.0e+3          # LB commutativity weight (GeomFuM standard: 1e3)
  geomfum_fmap_resolvent_gamma: 1.0   # resolvent regularisation (GeomFuM standard: 1.0)