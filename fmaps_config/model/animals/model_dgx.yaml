# fmaps_config/model/humanoids_inter.yaml

module:
  _target_: fmaps_finetune.modules.functional_map_module.FunctionalMapModule
  checkpoint_path: ${globals.checkpoint_path}
  k: ${globals.k}
  num_eigenvectors: ${globals.num_eigenvectors}
  seed: ${globals.training_seed}

  mode: train
  geo_cache_dir: ./geo_cache
  eval_results_dir: ./eval_results/model

#  geo_cache_workers: 4

  # When the loaded checkpoint was trained with ``stiffness_mode='learned'``
  # / ``'learned_positive'``, both train_laplacian and eval_laplacians MUST
  # use ``assembly: from_stiffness`` so the assembled Laplacian reads the
  # learned stiffness head (the operator the upstream losses supervised).
  # ``'diagonal_gram'`` silently ignores the head and rebuilds s_ij from
  # ``grad_coeffs`` — i.e. finetunes / evaluates the wrong operator.
  # FunctionalMapModule.setup() also auto-coerces any Gram-based assembly
  # to ``from_stiffness`` for learned checkpoints (logged at INFO level),
  # so the YAML below is the explicit, intended choice.
  train_laplacian:
    assembly: from_stiffness
    pruning: none

  # Eval with both variants side-by-side: ``from_stiffness`` is the
  # operator the model actually learnt; ``diagonal_gram`` is the
  # grad-coeffs fallback, kept for diagnostic comparison.  evaluate_pair
  # tag-prefixes every metric set when there is more than one entry, so
  # the two flavours land under separate keys in W&B.
  eval_laplacians:
    - assembly: from_stiffness             # learned head (the trained operator)
    - assembly: diagonal_gram              # gram fallback (diagnostic only)

  baselines: [robust, model]

  losses:
#    - _target_: fmaps_finetune.modules.functional_map_module.GeodesicDiffusionLoss
#      weight: 1.0
##      landmark_ratio: 0.2
#      num_landmarks: 256
#      alphas:
#        - 0.01
#        - 0.1
#        - 1.0
#        - 10.0
#      num_sample_vertices: 1024
#      normalize: false
    # Heat-method geodesic loss — the only loss in this config that
    # backprops into grad_coeffs (steps 2 & 3 are _apply_gradient /
    # _apply_divergence on the gradient head).  Required if you want
    # to finetune the gradient head under stiffness_mode='learned_positive'
    # in DDP — every other loss touches only the stiffness head, so
    # grad_coeffs gets no gradient and DDP crashes on unused params.
    - _target_: fmaps_finetune.modules.functional_map_module.HeatMethodGeodesicLoss
      weight: 1.0
      num_landmarks: 32
      num_sample_vertices: 512
      landmark_ratio: null      # set 0 < r < 1 to use bijective corr only
      landmark_seed: 0
      eps: 1.0e-6
      normalize: true
  random_init: false
  keep_areas_head: false
  freeze_input_projection: false
  freeze_areas_head: false
  max_vertices: 5000
  max_vertices_val: 0
  vertex_noise: 0.0
  w_prox: 0.0
  use_lora: false
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  lora_target_modules: all-linear
  lora_dora: false
  lora_rslora: false
  use_geomfum_eval: true
  geomfum_descriptors:
    - hks
    - wks
  geomfum_zoomout: false
  geomfum_zoomout_k_init: 20
  geomfum_zoomout_k_final: 50
  geomfum_zoomout_n_iters: 10
  geomfum_fmap_lmbda: 1.0
  geomfum_fmap_resolvent_gamma: 1.0
