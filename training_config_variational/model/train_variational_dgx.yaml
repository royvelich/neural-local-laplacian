module:
  _target_: neural_local_laplacian.modules.variational_modules.VariationalLaplacianTransformerModule
  input_dim: 3
  d_model: 768
  nhead: 8
  num_encoder_layers: 1
  dim_feedforward: 768
  num_eigenvalues: ${globals.num_eigenvalues}
  dropout: 0.2
  normalize_loss_weights: False
  normalize_patch_features: True
  scale_areas_by_patch_size: True
  input_projection_hidden_dims: null
  output_projection_hidden_dims: null

  detach_area_head: false           # area head is trained by the variational loss
  use_uniform_mass: false

  area_activation: bounded_sigmoid
  area_bound_C: 2.0

  # mcv_mode and stiffness_mode are unused by the variational loss path
  # but the parent class still asks for them; defaults are fine.
  mcv_mode: 'diagonal_gram'
  stiffness_mode: 'diagonal_gram'
  normalize_grad_by_k: true

  # Validation-only Laplacian configs (mesh / fmap paths are inherited).
  val_laplacian:
    assembly: diagonal_gram
    pruning: none

  # Functional-map validation. Same settings the dgx2 patch-level config
  # uses; the variational module inherits _validation_step_fmap from
  # LaplacianLocalModule, so wiring up fmap_val_cfg + a ValPairDataset
  # spec in val_dataset_specifications is sufficient.
  fmap_val_cfg:
    k: 15
    num_eigenvectors: 100
    max_vertices_val: 5000
    eval_laplacians:
      - assembly: diagonal_gram
        pruning: none
        area_weighted: false
    geo_cache_dir: ./geo_cache
    use_geomfum_eval: true
    geomfum_descriptors: [hks, wks]
    geomfum_zoomout: false
    geomfum_zoomout_k_init: 20
    geomfum_zoomout_k_final: 50
    geomfum_zoomout_n_iters: 10
    fmap_lmbda: 1.0
    fmap_resolvent_gamma: 1.0

  feature_extractor: null
  loss_configs:
    # Primary: bilinear-form supervision (strictly stronger than energy).
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.BilinearFormTestLoss
        loss_mode: 'signed_log'
      weight: 1.0

    # Gauge fix: predicted gradients should lie in the tangent plane.
    # Required because energy / bilinear losses are gauge-invariant
    # under per-vertex frame rotations (see §20 of the LBO conversation).
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.GradientTangencyTestLoss
      weight: 0.1

    # Optional auxiliary signals — disabled by default.
    # Diagonal of the bilinear form (redundant when BilinearFormTestLoss is on,
    # but cheap; enable with a small weight if helpful early in training).
#    - _target_: neural_local_laplacian.modules.losses.LossConfig
#      loss_module:
#        _target_: neural_local_laplacian.modules.losses.DirichletEnergyTestLoss
#        loss_mode: 'mse'
#      weight: 0.1
    # Direct supervision of vertex areas against the analytic GT.
#    - _target_: neural_local_laplacian.modules.losses.LossConfig
#      loss_module:
#        _target_: neural_local_laplacian.modules.losses.AreaSupervisionLoss
#      weight: 1.0
