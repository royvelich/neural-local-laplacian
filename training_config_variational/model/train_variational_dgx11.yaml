module:
  _target_: neural_local_laplacian.modules.variational_modules.VariationalLaplacianTransformerModule
  input_dim: 3
  d_model: 768
  nhead: 8
  num_encoder_layers: 1
  dim_feedforward: 768
  num_eigenvalues: ${globals.num_eigenvalues}
  dropout: 0.0
  normalize_loss_weights: False
  normalize_patch_features: True
  scale_areas_by_patch_size: True
  input_projection_hidden_dims: null
  output_projection_hidden_dims: null

  # Heat-kernel-only training: HeatKernelLoss is the *sole* loss.
  # The heat kernel only depends on (L, M); the gradient head is NOT
  # touched by this loss.  If you want the gradient head trained too,
  # add a small GradientVectorTestLoss anchor (and turn on
  # compute_gradients_all_points in the data module).
  detach_area_head: false
  use_uniform_mass: false

  area_activation: bounded_sigmoid
  area_bound_C: 2.0

  # Learned stiffness head, ≥ 0 (softplus output).  __init__ auto-coerces
  # val_laplacian.assembly and every fmap_val_cfg.eval_laplacians[].assembly
  # to 'from_stiffness' so the assembled L at validation time reads the
  # same head HeatKernelLoss supervises.
  mcv_mode: 'diagonal_gram'
  stiffness_mode: 'learned_positive'
  normalize_grad_by_k: true
  normalize_stiffness_by_k: true

  val_laplacian:
    assembly: diagonal_gram          # auto-coerced to from_stiffness
    pruning: none

  fmap_val_cfg:
    k: 15
    num_eigenvectors: 100
    max_vertices_val: 5000
    eval_laplacians:
      - assembly: diagonal_gram      # auto-coerced to from_stiffness
        pruning: none
        area_weighted: false
    geo_cache_dir: ./geo_cache
    use_geomfum_eval: true
    geomfum_descriptors: [hks, wks]
    geomfum_zoomout: false
    geomfum_zoomout_k_init: 20
    geomfum_zoomout_k_final: 50
    geomfum_zoomout_n_iters: 10
    fmap_lmbda: 1.0
    fmap_resolvent_gamma: 1.0

  feature_extractor: null
  loss_configs:
    # ── Sole loss: heat-kernel match ─────────────────────────────────
    # Predicted:  K_t = exp(-t · M⁻¹ L)            ∈ ℝ^{n×n}
    # GT:         K_t(v_i, v_j) = Σ_k exp(-λ_k t) · φ_k(v_i) · φ_k(v_j)
    #             from cotangent + barycentric mass on a dense
    #             reference triangulation of the same Monge patch.
    # diagonal_only: True  → match HKS only (what fmap reads).
    # normalize_per_t: True → scale-invariant per spectral band so
    #             small-t (large-entry) and large-t (small-entry)
    #             channels contribute comparably to the gradient.
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.HeatKernelLoss
        diagonal_only: true
        normalize_per_t: true
        loss_mode: 'mse'
        L_assembly: 'from_stiffness'
      weight: 1.0
