module:
  _target_: neural_local_laplacian.modules.variational_modules.VariationalLaplacianTransformerModule
  input_dim: 3
  d_model: 768
  nhead: 8
  num_encoder_layers: 1
  dim_feedforward: 768
  num_eigenvalues: ${globals.num_eigenvalues}
  dropout: 0.0
  normalize_loss_weights: False
  normalize_patch_features: True
  scale_areas_by_patch_size: True
  input_projection_hidden_dims: null
  output_projection_hidden_dims: null

  # The heat-method loss couples all three heads (areas → M and L,
  # stiffness → L, grad_coeffs → G), so areas should remain trainable.
  detach_area_head: false           # area head trained by LaplacianActionTestLoss + heat method
  use_uniform_mass: false

  area_activation: bounded_sigmoid
  area_bound_C: 2.0

  # Learned stiffness head, ≥ 0 (softplus output).  Decouples s_ij from
  # ‖g_ij‖²; the gradient head and stiffness head are trained by separate
  # losses below.  __init__ auto-coerces val_laplacian.assembly and every
  # fmap_val_cfg.eval_laplacians[].assembly to 'from_stiffness' so the
  # assembled Laplacian used by validation reads the learned head — the
  # same one LaplacianActionTestLoss supervises.  Look for an INFO log
  # ``[stiffness_mode=learned_positive] coercing ... to 'from_stiffness'``
  # at the start of the run to confirm.
  mcv_mode: 'diagonal_gram'
  stiffness_mode: 'learned_positive'
  normalize_grad_by_k: true
  normalize_stiffness_by_k: true

  # Validation-only Laplacian config.  The user-facing 'diagonal_gram'
  # value below is overridden in __init__ to 'from_stiffness' because
  # stiffness_mode is learned; you can leave it as-is.
  val_laplacian:
    assembly: diagonal_gram
    pruning: none

  fmap_val_cfg:
    k: 15
    num_eigenvectors: 100
    max_vertices_val: 5000
    eval_laplacians:
      - assembly: diagonal_gram     # auto-coerced to from_stiffness
        pruning: none
        area_weighted: false
    geo_cache_dir: ./geo_cache
    use_geomfum_eval: true
    geomfum_descriptors: [hks, wks]
    geomfum_zoomout: false
    geomfum_zoomout_k_init: 20
    geomfum_zoomout_k_final: 50
    geomfum_zoomout_n_iters: 10
    fmap_lmbda: 1.0
    fmap_resolvent_gamma: 1.0

  feature_extractor: null
  loss_configs:
    # ── Gradient head ────────────────────────────────────────────────
    # Pointwise vector match: ĝ_i^{(ℓ)} ≈ ∇_g f_ℓ(v_i).  Strongest signal
    # for the gradient head — pins direction, magnitude, and tangency.
    # Requires data_module test_func_sampler.compute_gradients_all_points: true.
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.GradientVectorTestLoss
        loss_mode: 'log_mse'        # log-compressed; preserves direction
        area_weighted: false
      weight: 1.0

    # ── Stiffness head ───────────────────────────────────────────────
    # Per-vertex match of the discrete Laplacian action:
    #   (Σ_j s_ij · δh_ℓ_j) / A_i  ≈  Δ_g h_ℓ(v_i)
    # Routes gradient through s_ij and A_i.  Required to train the
    # learned stiffness head — no other variational loss reads s.
    # Requires data_module test_func_sampler.compute_lb_all_points: true.
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.LaplacianActionTestLoss
        loss_mode: 'signed_log'     # scale-robust; handles signed Δ values
      weight: 1.0

    - loss_module:
        _target_: neural_local_laplacian.modules.losses.BilinearFormTestLoss
        loss_mode: 'mse'
      weight: 1.0       # tune relative to vector loss

    # ── End-to-end: heat-method geodesic supervision ─────────────────
    # Match the heat-method-recovered distance field against the exact
    # GT (MMP on a dense reference triangulation, attached by the
    # dataset when compute_geodesics: true).  Couples all three heads:
    #   (M + tL) u = e_s          ← areas, stiffness head
    #   ∇u  via   grad_coeffs      ← gradient head
    #   L φ = Gᵀ M_3 X_flat        ← stiffness + gradient head
    # L is assembled from the stiffness head ('from_stiffness') — the
    # same path val_laplacian uses under stiffness_mode='learned_positive'.
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.HeatMethodGeodesicLoss
        t: null                     # auto: t_scale · A_total / n
        t_scale: 1.0
        epsilon_reg: 1.0e-6
        loss_mode: 'mse'
        normalize_by_diameter: true # makes the loss patch-scale-invariant
        L_assembly: 'from_stiffness'
      weight: 1.0

    # ── Optional: area gauge anchor ──────────────────────────────────
    # GradientVectorTestLoss anchors g; LaplacianActionTestLoss anchors
    # the product s · A via the /A_i denominator.  AreaSupervisionLoss
    # adds a direct anchor on A against the density-aware GT
    # √det g(v_i) · |U|/n.  Enable if you find A drifting.
#    - _target_: neural_local_laplacian.modules.losses.LossConfig
#      loss_module:
#        _target_: neural_local_laplacian.modules.losses.AreaSupervisionLoss
#      weight: 0.1
