module:
  _target_: neural_local_laplacian.modules.variational_modules.VariationalLaplacianTransformerModule
  input_dim: 3
  d_model: 768
  nhead: 8
  num_encoder_layers: 1
  dim_feedforward: 768
  num_eigenvalues: ${globals.num_eigenvalues}
  dropout: 0.0
  normalize_loss_weights: False
  normalize_patch_features: True
  scale_areas_by_patch_size: True
  input_projection_hidden_dims: null
  output_projection_hidden_dims: null

  # Heat-method-only training: HeatMethodGeodesicLoss is the *sole* loss.
  # The heat method couples all three heads (areas → M and L, stiffness
  # → L, grad_coeffs → G), so none of them can be detached.
  #
  # Known gauge slack with no analytic anchors:
  #   • Stiffness scale: heat method is invariant under L → α·L (the
  #     normalised gradient field is unchanged).  Eigenvalues of L can
  #     drift, but EIGENVECTORS — what HKS/WKS / fmap actually consume
  #     — are unchanged by a uniform rescaling.  Plausibly harmless
  #     for the validation metric we care about; we'll find out.
  #   • Gradient magnitudes / non-tangent components: heat method reads
  #     ∇u then immediately normalises, so neither is constrained.
  #     Direction is constrained because the heat diffusion field is
  #     spatially coherent.
  detach_area_head: false
  use_uniform_mass: false

  area_activation: bounded_sigmoid
  area_bound_C: 2.0

  # Learned stiffness head, ≥ 0 (softplus output).  __init__ auto-coerces
  # val_laplacian.assembly and every fmap_val_cfg.eval_laplacians[].assembly
  # to 'from_stiffness'.
  mcv_mode: 'diagonal_gram'
  stiffness_mode: 'learned_positive'
  normalize_grad_by_k: true
  normalize_stiffness_by_k: true

  val_laplacian:
    assembly: diagonal_gram          # auto-coerced to from_stiffness
    pruning: none

  fmap_val_cfg:
    k: 15
    num_eigenvectors: 100
    max_vertices_val: 5000
    eval_laplacians:
      - assembly: diagonal_gram      # auto-coerced to from_stiffness
        pruning: none
        area_weighted: false
    geo_cache_dir: ./geo_cache
    use_geomfum_eval: true
    geomfum_descriptors: [hks, wks]
    geomfum_zoomout: false
    geomfum_zoomout_k_init: 20
    geomfum_zoomout_k_final: 50
    geomfum_zoomout_n_iters: 10
    fmap_lmbda: 1.0
    fmap_resolvent_gamma: 1.0

  feature_extractor: null
  loss_configs:
    # ── Sole loss: heat-method geodesic supervision ──────────────────
    # End-to-end match of the heat-method-recovered distance field
    # against the exact GT (MMP on a dense reference triangulation,
    # attached by the dataset when compute_geodesics: true).
    #
    # Pipeline per source s:
    #   (M + tL) u = e_s          ← areas, stiffness head
    #   ∇u via grad_coeffs        ← gradient head
    #   X = -∇u / ‖∇u‖
    #   (L + ε·M) φ = Gᵀ M_3 X    ← stiffness + gradient head
    #   φ ← φ − φ(s)              ← gauge fix
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.HeatMethodGeodesicLoss
        t: null                     # auto: t_scale · A_total / n
        t_scale: 1.0
        epsilon_reg: 1.0e-6
        loss_mode: 'mse'
        normalize_by_diameter: true
        L_assembly: 'from_stiffness'
      weight: 1.0
