module:
  _target_: neural_local_laplacian.modules.variational_modules.VariationalLaplacianTransformerModule
  input_dim: 3
  d_model: 768
  nhead: 8
  num_encoder_layers: 1
  dim_feedforward: 768
  num_eigenvalues: ${globals.num_eigenvalues}
  dropout: 0.0
  normalize_loss_weights: False
  normalize_patch_features: True
  scale_areas_by_patch_size: True
  input_projection_hidden_dims: null
  output_projection_hidden_dims: null

  # Heat-method-centric training: the heat method couples all three heads
  # (areas → M and L, stiffness → L, grad_coeffs → G), so every head must
  # remain trainable and the area head must not be detached.
  detach_area_head: false
  use_uniform_mass: false

  area_activation: bounded_sigmoid
  area_bound_C: 2.0

  # Learned stiffness head, ≥ 0 (softplus output).  Decouples s_ij from
  # ‖g_ij‖²; the gradient head and stiffness head are trained primarily
  # by the heat-method loss below (which reads both), with the analytic
  # test-function losses kept on at low weight as gauge anchors.
  # __init__ auto-coerces val_laplacian.assembly and every
  # fmap_val_cfg.eval_laplacians[].assembly to 'from_stiffness'.
  mcv_mode: 'diagonal_gram'
  stiffness_mode: 'learned_positive'
  normalize_grad_by_k: true
  normalize_stiffness_by_k: true

  # Validation-only Laplacian config.  Overridden to 'from_stiffness' in
  # __init__ because stiffness_mode is learned; you can leave it as-is.
  val_laplacian:
    assembly: diagonal_gram
    pruning: none

  fmap_val_cfg:
    k: 15
    num_eigenvectors: 100
    max_vertices_val: 5000
    eval_laplacians:
      - assembly: diagonal_gram     # auto-coerced to from_stiffness
        pruning: none
        area_weighted: false
    geo_cache_dir: ./geo_cache
    use_geomfum_eval: true
    geomfum_descriptors: [hks, wks]
    geomfum_zoomout: false
    geomfum_zoomout_k_init: 20
    geomfum_zoomout_k_final: 50
    geomfum_zoomout_n_iters: 10
    fmap_lmbda: 1.0
    fmap_resolvent_gamma: 1.0

  feature_extractor: null
  loss_configs:
    # ── Primary: heat-method geodesic supervision ────────────────────
    # End-to-end match of the heat-method-recovered distance field
    # against the exact GT (MMP on a dense reference triangulation,
    # attached by the dataset when compute_geodesics: true).  Couples
    # all three heads:
    #   (M + tL) u = e_s          ← areas, stiffness head
    #   ∇u  via   grad_coeffs      ← gradient head
    #   L φ = Gᵀ M_3 X_flat        ← stiffness + gradient head
    # L is assembled from the stiffness head ('from_stiffness') — the
    # same path val_laplacian uses under stiffness_mode='learned_positive'.
    # normalize_by_diameter makes the loss patch-scale-invariant but
    # also removes the absolute scale of L from the signal — that's why
    # the LaplacianAction anchor below is kept on at low weight.
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.HeatMethodGeodesicLoss
        t: null                     # auto: t_scale · A_total / n
        t_scale: 1.0
        epsilon_reg: 1.0e-6
        loss_mode: 'mse'
        normalize_by_diameter: true
        L_assembly: 'from_stiffness'
      weight: 0.0

    # ── Anchor: gradient head ────────────────────────────────────────
    # The heat method only reads ∇u through grad_coeffs and normalises
    # immediately, so it carries no information about |g_ij| magnitude
    # or non-tangent components.  A small weight here keeps the
    # gradient head pinned to ∇_g f_ℓ(v_i) (direction + magnitude +
    # tangency).  Requires test_func_sampler.compute_gradients_all_points: true.
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.GradientVectorTestLoss
        loss_mode: 'log_mse'
        area_weighted: false
      weight: 1.0

    # ── Anchor: stiffness head scale ─────────────────────────────────
    # The heat-method loss is gauge-degenerate under uniform rescaling
    # of L (φ is invariant to L → α L for any α > 0).  Without this
    # anchor the stiffness head can drift to arbitrary scale.  Small
    # weight is sufficient — the loss is just a scale pin.
    # Requires test_func_sampler.compute_lb_all_points: true.
    - _target_: neural_local_laplacian.modules.losses.LossConfig
      loss_module:
        _target_: neural_local_laplacian.modules.losses.LaplacianActionTestLoss
        loss_mode: 'signed_log'
      weight: 1.0

    # ── BilinearFormTestLoss intentionally omitted ───────────────────
    # Redundant with the gradient anchor (both supervise ∇_g f), and
    # turning it off lets compute_continuous_bilinear be disabled in
    # the data module — saves the Gauss-Legendre quadrature cost
    # per surface.

    # ── Optional: explicit area anchor ───────────────────────────────
    # Enable if you observe A_i drifting (the heat method only reads
    # areas through M and L, both of which the anchors above keep
    # bounded — explicit area supervision is usually not needed).
#    - _target_: neural_local_laplacian.modules.losses.LossConfig
#      loss_module:
#        _target_: neural_local_laplacian.modules.losses.AreaSupervisionLoss
#      weight: 0.1
