_target_: lightning.pytorch.Trainer
max_epochs: -1
devices: -1
accelerator: 'auto'
# HeatKernelLoss only reads (stiffness, areas) — the gradient head's
# parameters never appear in the backward graph, so DDP's default
# strict-parameter-use check fails.  ddp_find_unused_parameters_true
# tells the reducer to allow that (small perf overhead, no correctness
# impact).  If you add a GradientVectorTestLoss anchor later, you can
# flip this back to 'auto'.
strategy: 'ddp_find_unused_parameters_true'
num_sanity_val_steps: 0
log_every_n_steps: 1
check_val_every_n_epoch: 5
enable_progress_bar: True
gradient_clip_val: 0.5
logger:
 _target_: lightning.pytorch.loggers.WandbLogger
 project: neural-cotangent-weights-variational
 save_dir: 'wandb'
 log_model: 'all'
callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: "./checkpoints"
    filename: "last-model-{epoch:010d}"
    every_n_epochs: 5
    verbose: False
    save_on_train_epoch_end: True
